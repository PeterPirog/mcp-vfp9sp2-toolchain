*################################################################################################################
*FoxBin2Prg-AI.cfg — global AI profile for the OpenCode VFP toolchain
*Purpose: deterministic, minimal-noise, STRICT READ-ONLY BIN2PRG output.
*
*READ-ONLY ENFORCEMENT (upstream semantics, FoxBin2Prg_Settings.md):
*  <TYPE>_Conversion_Support: 1  = "Generate Text only (Diff)"
*  <TYPE>_Conversion_Support: 2  = "Generate Text and Bin (Merge)"  <-- NOT used here
*All types are pinned to 1, so this profile can never regenerate binaries,
*even if invoked with an *.sc2/*.vc2/*.pj2 text input.
*
*Config precedence (designed, not accidental):
*  This file is passed as the cCFG_File parameter with InhibitInheritance: 3
*  => only the defaults + THIS file are read. A project's own FoxBin2Prg.cfg
*     is therefore NEVER inherited and can never change AI behavior.
*     (Presence of a project FoxBin2Prg.cfg is reported by vfp_detect/vfp_status.)
*################################################################################################################

*-- Config precedence (parameter-file-only setting, read ONLY from this cfg)
*    3 = read ONLY defaults + this file. No project FoxBin2Prg.cfg, no per-folder
*    cfg, no per-table cfg may be inherited, so AI behavior is deterministic and
*    never silently altered by a project's own FoxBin2Prg.cfg.
InhibitInheritance: 3

*-- Internal / non-interactive
Language: EN                 && Deterministic messages and logs in English
ShowProgressbar: 0           && No progress window (also forced per-call with parameter 1)
DontShowErrors: 1            && No modal error messageboxes; errors surface in output/exit code
ExtraBackupLevels: 0         && No .BAK files ever (strict read-only: nothing may be written next to sources)
Debug: 0                     && No per-file .Log files next to sources
OptimizeByFilestamp: 0       && Always regenerate (deterministic, branch-safe)

*-- Deterministic output / minimal metadata noise
NoTimestamps: 1              && Clear timestamp fields in generated text
ClearUniqueID: 1             && Clear UniqueID fields (clean diff/grep)
HomeDir: 0                   && Do not store machine-specific HomeDir in PJ2
BodyDevInfo: 2               && Do not keep DevInfo or ObjRev in PJ2
RemoveNullCharsFromCode: 1   && Drop .Null. chars from source code
ClearDBFLastUpdate: 1        && Clear DBF LastUpdate (stable db2)

*-- Structure of generated text
UseClassPerFile: 2           && Multiple file.baseclass.class.vc2 files (separate class files)
RedirectClassPerFileToMain: 0
RedirectClassType: 0
ClassPerFileCheck: 0
UseFormSettings: 0           && Do NOT enable form-per-file splitting
OldFilesPerDBC: 0
PRG_Compat_Level: 0

*-- Conversion support: STRICT READ-ONLY (1 = Text-only generation, never binary)
PJX_Conversion_Support: 1    && project: text only
VCX_Conversion_Support: 1    && class library: text only
SCX_Conversion_Support: 1    && form: text only
FRX_Conversion_Support: 1    && report: text only
LBX_Conversion_Support: 1    && label: text only
MNX_Conversion_Support: 1    && menu: text only
DBC_Conversion_Support: 1    && database container: text only
DBF_Conversion_Support: 1    && table: structure text only (value 2/4/8 would enable binary/data import)
FKY_Conversion_Support: 1
MEM_Conversion_Support: 1

*-- Project files
CheckFileInPath: 0
