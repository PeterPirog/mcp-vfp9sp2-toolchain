name: pure-read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pure-read-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-read:
    # The CI runner deliberately has NO Visual FoxPro and NO FoxBin2Prg
    # installation. The point of this workflow is to PROVE that the
    # PURE_READ plane (Core Service, capability discovery, detection,
    # dbfbridge + DBF_Anonymizer adapters) works without VFP.
    name: pure-read (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is mandatory (target platform); Ubuntu covers the
        # strictly pure-Python parts cross-platform.
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
        exclude:
          # Python 3.14 on Windows is the current dev interpreter; keep the
          # full matrix lean by excluding 3.14 on Ubuntu until the suite is
          # verified there as well.
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner (dev-only, NOT a runtime dependency)
        run: python -m pip install --upgrade pytest

      - name: Assert NO VFP9 on the runner (intentional PURE_READ CI)
        run: |
          python - <<'PY'
          import os, sys
          exe = os.environ.get("VFP9_EXE") or r"C:\Program Files (x86)\Microsoft Visual FoxPro 9\vfp9.exe"
          if os.path.isfile(exe):
              sys.exit("PURE_READ CI must run without VFP9: found %s" % exe)
          print("OK: no VFP9 on runner (intentional)")
          PY

      - name: Baseline import check (no side effects, no VFP)
        run: |
          set -eu
          python -c "import sys, os; sys.path.insert(0, 'src'); import vfp_toolchain; print('import OK')"

      - name: Test suite (VFP-dependent tests are skipped, never masked)
        run: python -m pytest tests -v --color=yes
        env:
          # Make capability discovery report a clean "no VFP" state.
          VFP9_EXE: C:/ci/no-vfp-here/vfp9.exe
          VFP_FOXBIN2PRG_DIR: C:/ci/no-foxbin2prg-here
          # POSIX note: the Windows-style paths above are intentionally
          # non-existent on both OSes for this check.
